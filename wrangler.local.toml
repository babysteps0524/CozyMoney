# Local-only configuration for CozyMoney authentication development.
# Never use this file for production deployment.
name = "cozymoney-auth-local"
compatibility_date = "2026-10-17"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "D1_AUTH_DB"
database_name = "cozymoney-auth-db-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "src/migrations"

[vars]
AUTH_EMAIL_PROVIDER = "log"
AUTH_SITE_URL = "http://localhost:8788"
