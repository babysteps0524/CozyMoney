<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="세금을 이해하고 관리하는 방법, 연말정산부터 다양한 절세 정보까지 - COZYMONEY"
    />
    <script type="module" src="/src/main.js"></script>
    <title>세테크 | COZYMONEY</title>
  </head>
  <body
    bg="[url(/images/bg/bg-04.svg)]"
    class="bodyText"
    relative
    min-h="100vh"
    flex
    flex-col
  >
    <aside
      hidden
      min-w-1600px:block
      fixed
      z-10
      top="170px"
      left="[calc(50%-800px)]"
      w="160px"
      h="600px"
      border="1px dashed #C1694F"
      bg="#FAF3EA"
    ></aside>

    <header w="1240px" mx="auto">
      <h1 py="10px 16px">
        <a href="/" data-page="home">
          <img
            src="/images/logo/cozymoney_01.svg"
            alt="코지머니"
            w="180px"
            md:w="220px"
            lg:w="240px"
            h="auto"
            mx="auto"
          />
        </a>
      </h1>
    </header>

    <nav
      sticky
      top="0"
      z="100"
      mb="40px"
      bg="[url(/images/bg/bg-04.svg)]"
      w="1240px"
      mx="auto"
    >
      <ul
        flex
        justify="center"
        border-y="2px solid #C76B08FF"
        pt="12px"
        pb="10px"
      >
        <li mx="20px">
          <a href="/pages/stock.html" data-page="stock" class="navText">주식</a>
        </li>
        <li mx="20px">
          <a
            href="/pages/realestate.html"
            data-page="realestate"
            class="navText"
            >부동산</a
          >
        </li>
        <li mx="20px">
          <a href="/pages/taxSaving.html" data-page="taxSaving" class="navText"
            >세테크</a
          >
        </li>
        <li mx="20px">
          <a href="/pages/insurance.html" data-page="insurance" class="navText"
            >보험</a
          >
        </li>
        <li mx="20px">
          <a
            href="/pages/computertax.html"
            data-page="computertax"
            class="navText"
            >전산세무</a
          >
        </li>
      </ul>
    </nav>

    <div
      w="full"
      max-w="1240px"
      mx="auto"
      px="16px"
      mb="40px"
      flex
      flex-col
      lg:flex-row
      gap="24px"
      flex-1
    >
      <main
        id="page-content"
        w="full"
        lg:flex-1
        bg="#ffffff"
        rounded="16px"
        py="24px"
        px="16px"
        md:px="32px"
        lg:px="72px"
        shadow="xl"
      >
        <section mb="40px">
          <p text="14px #9b8069" font="600" mb="10px">CozyMoney</p>
          <h1 text="32px" font="600" mb="14px">세테크</h1>
          <p text="16px #777" leading="7">
            세금을 이해하고 관리하는 방법<br />
            연말정산부터 다양한 절세 정보까지
          </p>
        </section>

        <section id="postList"></section>

        <nav
          id="pagination"
          flex
          justify-center
          items-center
          gap="8px"
          mt="40px"
          mb="60px"
        ></nav>
      </main>

      <aside
        w="full"
        lg:basis="284px"
        lg:flex-shrink-0
        lg:sticky
        lg:top="100px"
        h="fit"
      >
        <nav class="asideNav" shadow="xl">
          <h2 class="asideNavH2">최신 글</h2>
          <ul id="latestPosts" list-none p="0" m="0"></ul>
        </nav>
        <div mt="30px" text="center" border="1px dashed #C1694F" bg="#FAF3EA">
          <ins
            class="adsbygoogle"
            block
            data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
            data-ad-slot="ca-pub-XXXXXXXXXXXXXXXX"
            data-ad-format="rectangle"
          ></ins>
        </div>
      </aside>
    </div>

    <footer bg="#523f2e" text="center #ffffff" py="20px 10px" px="20px">
      <div flex justify="center" items="center" gap="16px" mb="10px">
        <a
          href="/pages/privacy.html"
          text="14px #ffffff"
          hover="text-[#F5DFD3]"
        >
          개인정보처리방침
        </a>
      </div>
      <p>
        <small>
          Copyright
          <i class="i-mdi-copyright text-16px"></i>
          2026.CozyMoney All rights reserved.
        </small>
      </p>
    </footer>
  </body>
</html>
